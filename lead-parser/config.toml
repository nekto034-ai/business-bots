# Настройки парсера лидов.
# Меняй цифры и списки здесь — код трогать не нужно.

[run]
# Сколько подходящих компаний собрать за один запуск
target_leads = 120
# Сколько компаний брать максимум из одного поиска «ниша + город»,
# чтобы список был разнообразным, а не 60 натяжных потолков из Казани
per_query_limit = 3
# Сколько страниц выдачи 2ГИС листать на один поиск (на странице 12 компаний)
max_pages_per_query = 4
# Пауза между запросами к одному сайту, секунд (от и до). Меньше — быстрее, но выше риск блокировки
delay_min = 4.0
delay_max = 8.0
# Каждые rest_every запросов к одному сайту — перерыв rest_min..rest_max секунд (как будто человек отвлёкся)
rest_every = 40
rest_min = 30
rest_max = 60
# ГЛАВНОЕ ПРАВИЛО: не попасть в блокировку. Если сайт хоть раз показал капчу или
# ответил «слишком много запросов» — парсер останавливается и столько часов не запускается
cooldown_hours = 12
# Не показывать компании, которые уже попадали в прошлые выгрузки
skip_already_exported = true
# Проверять вакансии на hh.ru (+1 запрос на компанию)
check_hh = true
# Открывать сайт компании и оценивать его
check_websites = true
# Сколько страниц поиска hh листать в поиске компаний с amoCRM (50 вакансий на странице)
hh_amocrm_pages = 5

[sources]
# Откуда брать компании (оба входа сливаются в один список)
hh_amocrm = true          # компании, которые пишут про amoCRM в вакансиях на hh — идут первыми
niches_2gis = true        # поиск в 2ГИС по нишам из списка ниже

[filters]
# Жёсткие фильтры: не прошёл — компания не попадает в список
max_branches = 1          # 1 = только компании без филиалов
max_reviews = 15          # больше отзывов — уже раскрученная компания
require_phone = true      # без телефона звонить некуда
max_hh_vacancies = 30     # у компании больше вакансий на hh — значит, она крупная, не наш клиент
# Конкуренты (интеграторы CRM, веб-студии, разработчики ПО) — не показываем.
# Рубрики 2ГИС: если у компании есть хоть одна из них — это конкурент
competitor_rubrics = [
  "Автоматизация бизнес-процессов", "Автоматизация торговли",
  "Разработка программного обеспечения", "Разработка и продвижение сайтов",
]
# Рубрики, которые считаем конкурентом, только если это ОСНОВНОЕ занятие компании
# (у кадровых агентств «консалтинг» часто идёт довеском — их не трогаем)
competitor_primary_rubrics = ["Управленческий консалтинг"]
# Слова в названии компании, которые выдают конкурента
competitor_name_words = ["crm", "срм", "интегратор", "amo", "амо", "битрикс", "bitrix", "роп"]
# Федеральные бренды и сети: их офисы 2ГИС часто показывает как отдельные компании без филиалов
stop_list = [
  "МТС", "Билайн", "МегаФон", "Tele2", "Т2", "Ростелеком", "Yota", "Дом.ру",
  "Сбер", "Сбербанк", "ВТБ", "Альфа-Банк", "Т-Банк", "Тинькофф", "Газпромбанк", "Совкомбанк", "Почта Банк",
  "Почта России", "СДЭК", "Boxberry", "ПЭК", "Деловые Линии", "Байкал Сервис",
  "Ozon", "Wildberries", "Яндекс Маркет", "Яндекс", "Авито",
  "Магнит", "Пятёрочка", "Перекрёсток", "Лента", "Ашан", "Fix Price", "Светофор",
  "DNS", "М.Видео", "Эльдорадо", "Леруа Мерлен", "Лемана Про", "Петрович", "OBI",
  "Инвитро", "Гемотест", "Хеликс", "Этажи", "Самолет Плюс", "Инком", "Миэль",
  "Tez Tour", "Anex Tour", "Coral Travel",
  "Додо Пицца", "Вкусно — и точка", "Бургер Кинг", "KFC", "Ростикс", "Шоколадница",
]

[scoring]
# Сколько баллов даёт каждый признак. Итоговый список сортируется по сумме.
crm_amocrm = 5            # пользуются amoCRM (из вакансий на hh или по форме на сайте) — главный приоритет
crm_other = 0             # другая CRM (Битрикс24) — просто отмечаем в таблице
b2b = 0                   # продают компаниям — Артём: B2B или B2C неважно
seasonal = 0              # сезонная ниша — Артём: не принципиально
reviews_0 = 3             # отзывов нет вообще
reviews_1_5 = 2
reviews_6_15 = 1
new_company = 2           # появилась в 2ГИС недавно
new_company_months = 18   # «недавно» — это сколько месяцев
no_website = 2            # сайта нет совсем
social_only = 2           # вместо сайта — соцсеть / Taplink
broken_website = 3        # сайт указан, но не открывается
per_site_issue = 1        # за каждую проблему сайта (нет https, не под телефон, ...)
max_site_issues = 3       # но не больше стольких баллов за сайт
hiring_sales = 4          # на hh висит вакансия продажника — у них точно есть продажи
hiring_sales_unconfirmed = 2  # то же, но сверили только по названию и городу (сайта нет для сверки)
hiring_any = 1            # на hh есть какие-то вакансии — компания растёт

# Города. alias — как город называется в адресе 2ГИС, hh_area — номер города на hh.ru
# Только часовой пояс МСК, без Москвы и Питера (там все конкуренты).
# Чтобы добавить город — убери # в начале его строк.
[[cities]]
name = "Казань"
alias = "kazan"
hh_area = 88

[[cities]]
name = "Волгоград"
alias = "volgograd"
hh_area = 24

