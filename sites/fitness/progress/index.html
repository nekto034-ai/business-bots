<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#11161c">
<title>Прогресс</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Cpath d=%22M4 26 L12 16 L18 21 L28 6%22 fill=%22none%22 stroke=%22%232a78d6%22 stroke-width=%224%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("theme")||"light"}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700;800&display=swap">
<style>
  /* Progress site: the strategic view next to the gym logbook (fit.<host>). Same data, read-mostly.
     Tabs: Сегодня / Вчера / Неделя / Месяц / Путь. Charts are hand-drawn SVG (no libraries):
     thin marks, 4px rounded data ends, hairline grid, one shared tooltip. */
  :root {
    --bg: #eef1f4; --surface: #ffffff; --surface-2: #f6f8fa; --fg: #121820; --muted: #5f6b77; --line: #dbe1e7;
    --grid: #e6e9ed; --axis: #c3c9d0;
    --s-steps: #2a78d6; --s-pulse: #e34948; --s-sleep: #6250d6; --s-load: #2a78d6; --s-weight: #1baf7a;
    --st-deep: #2a78d6; --st-light: #1baf7a; --st-rem: #6250d6; --st-awake: #eb6834;
    --ok: #2f9e57; --ok-ink: #006300; --bad: #d03b3b; --warn: #c27c00;
    --accent: #1f5fd1; --accent-ink: #fff;
    --shadow: 0 1px 2px rgba(18,24,32,.06), 0 6px 20px rgba(18,24,32,.06);
    --font-display: "Unbounded", "Arial Black", sans-serif;
    --font-body: "Golos Text", "Segoe UI", Roboto, Arial, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root[data-theme="auto"] {
      --bg: #0d1116; --surface: #161c23; --surface-2: #1c242d; --fg: #eaf0f5; --muted: #95a2ae; --line: #27313b;
      --grid: #232b34; --axis: #36414c;
      --s-steps: #3987e5; --s-pulse: #e66767; --s-sleep: #9085e9; --s-load: #3987e5; --s-weight: #199e70;
      --st-deep: #3987e5; --st-light: #199e70; --st-rem: #9085e9; --st-awake: #d95926;
      --ok: #4cbf75; --ok-ink: #0ca30c; --bad: #e66767; --warn: #f0b429; --accent: #4d8cf0;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
      --bg: #0d1116; --surface: #161c23; --surface-2: #1c242d; --fg: #eaf0f5; --muted: #95a2ae; --line: #27313b;
      --grid: #232b34; --axis: #36414c;
      --s-steps: #3987e5; --s-pulse: #e66767; --s-sleep: #9085e9; --s-load: #3987e5; --s-weight: #199e70;
      --st-deep: #3987e5; --st-light: #199e70; --st-rem: #9085e9; --st-awake: #d95926;
      --ok: #4cbf75; --ok-ink: #0ca30c; --bad: #e66767; --warn: #f0b429; --accent: #4d8cf0;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { padding-top: env(safe-area-inset-top, 0px); }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.45;
    padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(40px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  .wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .wrap > * { min-width: 0; }
  button, input, textarea { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .appbar { display: flex; align-items: center; gap: 10px; }
  .brand { font-family: var(--font-display); font-weight: 800; font-size: 20px; margin-right: auto; }
  .upd { font-size: 12px; color: var(--muted); text-align: right; line-height: 1.25; }
  .icon-btn { width: 38px; height: 38px; flex: none; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; }
  .icon-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .tabs { position: sticky; top: 0; z-index: 5; display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; padding: 4px; border-radius: 14px;
    background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(8px); box-shadow: var(--shadow); }
  .tabs button { border: 0; background: transparent; border-radius: 10px; padding: 9px 2px; font-size: 13.5px; font-weight: 600; color: var(--muted); cursor: pointer; }
  .tabs button[aria-selected="true"] { background: var(--fg); color: var(--surface); }

  .card { background: var(--surface); border-radius: 18px; padding: 16px; box-shadow: var(--shadow); }
  .card h2 { font-size: 16px; margin: 0 0 4px; }
  .card .sub { font-size: 13px; color: var(--muted); margin: 0 0 12px; }
  .head { display: flex; align-items: center; gap: 10px; }
  .head h1 { font-family: var(--font-display); font-weight: 700; font-size: 22px; margin: 0; line-height: 1.15; flex: 1; }
  .nav { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 18px; font-weight: 700; }
  .nav:disabled { opacity: .35; cursor: default; }

  .tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  @media (min-width: 560px) { .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .tile { background: var(--surface); border-radius: 16px; padding: 12px 14px; box-shadow: var(--shadow); min-width: 0; }
  .tile .lbl { font-size: 12.5px; color: var(--muted); }
  .tile .val { font-size: 24px; font-weight: 700; line-height: 1.15; margin-top: 2px; overflow-wrap: anywhere; }
  .tile .val small { font-size: 14px; font-weight: 600; color: var(--muted); margin-left: 2px; }
  .tile .dl { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .up { color: var(--ok-ink); font-weight: 600; } .down { color: var(--bad); font-weight: 600; }
  .meter { height: 6px; border-radius: 999px; background: color-mix(in srgb, var(--s-steps) 18%, var(--surface-2)); margin-top: 8px; overflow: hidden; }
  .meter i { display: block; height: 100%; border-radius: inherit; background: var(--s-steps); width: 0; transition: width 1s cubic-bezier(.2,.8,.2,1); }

  .hero { border-radius: 22px; padding: 20px 18px; color: #fff; box-shadow: var(--shadow);
    background: radial-gradient(120% 140% at 100% 0%, #4d8cf0 0%, #1f5fd1 45%, #123d8a 100%); }
  .hero .k { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; opacity: .85; }
  .hero .big { font-family: var(--font-display); font-weight: 800; font-size: 52px; line-height: 1; margin: 8px 0 4px; }
  .hero .big small { font-size: 22px; font-weight: 700; margin-left: 4px; }
  .hero .eq { font-size: 15px; opacity: .95; }
  .hero .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; }
  .hero .row b { display: block; font-size: 20px; font-family: var(--font-display); }
  .hero .row span { font-size: 12px; opacity: .85; }

  svg.chart { display: block; width: 100%; height: auto; overflow: visible; }
  svg.chart text { font-family: var(--font-body); font-size: 11px; fill: var(--muted); }
  svg.chart .grid { stroke: var(--grid); stroke-width: 1; }
  svg.chart .base { stroke: var(--axis); stroke-width: 1; }
  svg.chart .hit { fill: transparent; cursor: pointer; }
  svg.chart .bar { transform-box: fill-box; transform-origin: bottom; animation: grow .8s cubic-bezier(.2,.8,.2,1) both; }
  svg.chart .line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: draw 1.2s ease-out forwards; }
  svg.chart .xh { stroke: var(--axis); stroke-width: 1; }
  @keyframes grow { from { transform: scaleY(0); } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .empty { font-size: 13.5px; color: var(--muted); background: var(--surface-2); border-radius: 12px; padding: 12px; }

  .hbars { display: flex; flex-direction: column; gap: 9px; }
  .hb .top { display: flex; justify-content: space-between; gap: 8px; font-size: 13.5px; }
  .hb .top span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .hb .track { position: relative; height: 10px; border-radius: 999px; background: var(--surface-2); margin-top: 4px; }
  .hb .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: var(--s-load); width: 0; transition: width 1s cubic-bezier(.2,.8,.2,1); }
  .hb .band { position: absolute; top: -3px; bottom: -3px; border-left: 1px solid var(--axis); border-right: 1px solid var(--axis); background: color-mix(in srgb, var(--ok) 10%, transparent); border-radius: 3px; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); margin-top: 10px; }
  .legend i { display: inline-block; width: 12px; height: 8px; border-radius: 2px; margin-right: 5px; vertical-align: 0; }

  .grow-row { display: grid; grid-template-columns: 1fr; gap: 14px; }
  .gr .name { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; font-weight: 600; }
  .gr .pct { color: var(--ok-ink); white-space: nowrap; }
  .gr .pair { display: grid; grid-template-columns: 54px 1fr auto; gap: 6px 8px; align-items: center; font-size: 12.5px; color: var(--muted); margin-top: 6px; }
  .gr .b { height: 12px; border-radius: 0 6px 6px 0; background: color-mix(in srgb, var(--s-load) 35%, var(--surface-2)); width: 0; transition: width 1.1s cubic-bezier(.2,.8,.2,1); }
  .gr .b.now { background: var(--s-load); }
  .gr .goal { font-size: 12.5px; color: var(--muted); margin-top: 6px; }

  table.t { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  table.t th { text-align: left; font-weight: 600; color: var(--muted); font-size: 12px; padding: 6px 4px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.t td { padding: 7px 4px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.t tr:last-child td { border-bottom: 0; }
  .scroll { overflow-x: auto; margin: 0 -4px; }

  .ex-list { display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; }
  .ex-list div { display: flex; justify-content: space-between; gap: 10px; }
  .ex-list span:last-child { color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
  .pr { font-size: 11.5px; font-weight: 700; background: #fff3c4; color: #6b4a00; border-radius: 999px; padding: 1px 7px; margin-left: 6px; }

  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .seg button, .chip { height: 42px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); font-weight: 600; cursor: pointer; padding: 0 10px; }
  .seg button[aria-pressed="true"], .chip[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: #fff; }
  .seg button.dev[aria-pressed="true"] { background: var(--warn); border-color: var(--warn); color: #1a1405; }
  .lvl { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .lvl button { height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); font-weight: 700; cursor: pointer; }
  .lvl button[aria-pressed="true"] { background: var(--fg); color: var(--surface); border-color: var(--fg); }
  .form { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); }
  .form .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .form input[type=time], .form input[type=text], textarea { height: 40px; border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 0 10px; font-size: 15px; }
  textarea { width: 100%; height: auto; min-height: 60px; padding: 9px 10px; resize: vertical; margin-top: 8px; }
  .primary { height: 44px; border: 0; border-radius: 12px; background: var(--ok); color: #fff; font-weight: 700; cursor: pointer; padding: 0 16px; }
  .ghost { height: 40px; border: 1px solid var(--line); border-radius: 12px; background: transparent; font-weight: 600; cursor: pointer; padding: 0 14px; }
  .entries { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .entry { display: flex; align-items: center; gap: 10px; font-size: 14px; background: var(--surface-2); border-radius: 12px; padding: 8px 10px; }
  .entry b { font-family: var(--font-display); font-size: 16px; min-width: 44px; }
  .entry .x { margin-left: auto; border: 0; background: transparent; color: var(--muted); font-size: 18px; cursor: pointer; }
  .tag { font-size: 12px; border-radius: 999px; padding: 2px 8px; background: var(--surface); border: 1px solid var(--line); }
  .tag.zhor { background: var(--bad); color: #fff; border-color: transparent; }
  .saved { font-size: 12.5px; color: var(--ok-ink); font-weight: 600; }

  .tip { position: fixed; z-index: 20; pointer-events: none; background: var(--fg); color: var(--surface); border-radius: 10px; padding: 7px 10px; font-size: 12.5px; line-height: 1.35; box-shadow: var(--shadow); max-width: 240px; opacity: 0; transition: opacity .12s; }
  .tip b { font-size: 14px; }
  .tip.on { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } svg.chart .line { stroke-dashoffset: 0; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="appbar">
    <span class="brand">Прогресс</span>
    <span class="upd" id="upd"></span>
    <button class="icon-btn" id="theme-btn" type="button" aria-label="Тема"></button>
  </div>
  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="today">Сегодня</button>
    <button role="tab" data-tab="yday">Вчера</button>
    <button role="tab" data-tab="week">Неделя</button>
    <button role="tab" data-tab="month">Месяц</button>
    <button role="tab" data-tab="path">Путь</button>
  </nav>
  <main id="view" class="wrap" style="gap:14px;width:100%"><div class="empty">Загружаю данные…</div></main>
</div>
<div class="tip" id="tip" role="tooltip"></div>

<script>
/* ---------- Program knowledge: muscles per exercise (keep in sync with fit site DAYS) ----------
   p = main muscles (100% of the load), x = helpers (50%). bw = bodyweight (kg = extra plates only),
   x2 = kg is per dumbbell, assist = kg is the gravitron counterweight (lifted = bodyweight − kg). */
const EX = {
  abs_ddx: { n: "Скручивания DDX", p: ["abs"], x: [] },
  chest_machine: { n: "Жим на грудь", p: ["chest"], x: ["delts", "tri"] },
  incline_db: { n: "Жим гантелей на наклонной", p: ["chest"], x: ["delts", "tri"], x2: true },
  lateral: { n: "Махи в стороны", p: ["delts"], x: [], x2: true },
  shoulder_press: { n: "Жим на плечи", p: ["delts"], x: ["tri"] },
  tri_pushdown: { n: "Трицепс в блоке", p: ["tri"], x: [] },
  fly: { n: "Бабочка", p: ["chest"], x: [] },
  goblet_squat: { n: "Гоблет-присед", p: ["quads", "glutes"], x: ["abs"] },
  abs_leg_raise: { n: "Подъём ног в упоре", p: ["abs"], x: [], bw: true },
  leg_press: { n: "Жим ногами", p: ["quads", "glutes"], x: ["hams"], prior: 320 },
  leg_curl: { n: "Сгибание ног", p: ["hams"], x: ["calves"] },
  calf_seated: { n: "Икры сидя", p: ["calves"], x: [] },
  lunge: { n: "Выпады с гантелями", p: ["quads", "glutes"], x: ["hams"] },
  hyper: { n: "Гиперэкстензия", p: ["lower", "glutes"], x: ["hams"], bw: true },
  leg_ext: { n: "Разгибание ног", p: ["quads"], x: [] },
  adduct: { n: "Сведение / разведение ног", p: ["adduct"], x: ["glutes"] },
  abs_situp: { n: "Подъём корпуса", p: ["abs"], x: [], bw: true },
  gravitron: { n: "Подтягивания (гравитрон)", p: ["back"], x: ["bi"], assist: true },
  row_horiz: { n: "Тяга горизонтальная", p: ["back"], x: ["bi", "rear"] },
  rear_fly: { n: "Обратные махи", p: ["rear"], x: ["back"], x2: true },
  pulldown: { n: "Тяга верхнего блока", p: ["back"], x: ["bi"] },
  curl: { n: "Бицепс с гантелями", p: ["bi"], x: [], x2: true },
  row_one: { n: "Тяга одной рукой", p: ["back"], x: ["bi", "rear"] },
  rdl: { n: "Румынская тяга", p: ["hams", "glutes"], x: ["lower"] }
};
const MUS = [["chest", "Грудь"], ["back", "Спина"], ["delts", "Плечи"], ["rear", "Задняя дельта"], ["bi", "Бицепс"], ["tri", "Трицепс"], ["abs", "Пресс"],
  ["quads", "Передняя поверхность бедра"], ["hams", "Задняя поверхность бедра"], ["glutes", "Ягодицы"], ["calves", "Икры"], ["lower", "Поясница"], ["adduct", "Приводящие"]];
const DAY_RU = { A: "А · жимы", B: "Б · ноги", C: "В · тяги" };
const STATE = ["", "😫", "😕", "😐", "🙂", "💪"];
const STEP_GOAL = 10000;
const START = "2026-10-13"; // first workout of the comeback (Путь counts from here)
const OFFSITE = ["2026-10-13"]; // workouts done before the gym site kept numbers (counted, no weights)
const MIN_SETS = 6; // fewer sets = a test entry, not a workout
const GOALS = { weightNY: 108, weightStart: 122.7 }; // New Year target ~107–109 kg (PLAN.md)

/* ---------- Helpers ---------- */
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
const iso = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const parse = s => new Date(s + "T12:00:00");
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const todayISO = () => iso(new Date());
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const num = v => { const x = parseFloat(String(v ?? "").replace(",", ".")); return isFinite(x) ? x : 0; };
const fmt = (n, d = 0) => (Math.round(n * 10 ** d) / 10 ** d).toLocaleString("ru-RU", { minimumFractionDigits: 0, maximumFractionDigits: d });
const fmtDur = min => min >= 60 ? Math.floor(min / 60) + " ч " + pad(Math.round(min % 60)) + " м" : Math.round(min) + " м";
const fmtT = kg => kg >= 1000 ? fmt(kg / 1000, 1) + " т" : fmt(kg) + " кг";
const dLong = s => parse(s).toLocaleDateString("ru-RU", { weekday: "long", day: "numeric", month: "long" });
const dShort = s => s.slice(8, 10) + "." + s.slice(5, 7);
const wd = s => parse(s).toLocaleDateString("ru-RU", { weekday: "short" });
const hm = isoStr => new Date(isoStr).toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
const localDate = isoStr => iso(new Date(isoStr));
function plural(n, a, b, c) { n = Math.abs(Math.round(n)); const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? a : m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20) ? b : c; }
const EQ = [[5000, "слон", "слона", "слонов"], [1500, "легковая машина", "легковые машины", "легковых машин"], [300, "пианино", "пианино", "пианино"], [60, "мешок цемента", "мешка цемента", "мешков цемента"]];
function equiv(kg) { for (const [w, a, b, c] of EQ) { const n = Math.round(kg / w); if (n >= 1) return "≈ " + n + " " + plural(n, a, b, c); } return ""; }
const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0;

/* ---------- Data ---------- */
let D = null, tab = "today", cursor = { week: null, month: null }, intraday = {};
const by = { days: {}, sleep: {}, ex: {}, sess: {}, journal: {} };
function index() {
  by.days = {}; by.sleep = {}; by.ex = {}; by.sess = {}; by.journal = {};
  D.days.forEach(d => { by.days[d.date] = d; });
  // Night sleep belongs to the day you wake up; keep the longest record of that day.
  D.sleep.forEach(s => { const k = localDate(s.end); const m = sleepMin(s); if (!by.sleep[k] || m > sleepMin(by.sleep[k])) by.sleep[k] = s; });
  D.exercise.forEach(e => { const k = localDate(e.start); (by.ex[k] = by.ex[k] || []).push(e); });
  D.sessions.forEach(s => { if (sessionStats(s).sets >= MIN_SETS) (by.sess[s.date] = by.sess[s.date] || []).push(s); });
  D.journal.forEach(j => { by.journal[j.date] = j; });
}
function sleepMin(s) {
  if (!s) return 0;

  h += `<section class="card"><h2>Восстановление: сон по неделям</h2><p class="sub">Средний сон за неделю</p>${columns(wk.map(x => ({ label: dShort(x.w), value: x.s.sleep / 60, tip: `<b>${x.s.sleep ? fmtDur(x.s.sleep) : "нет данных"}</b> в среднем<br>неделя с ${dShort(x.w)}` })), { ref: 8, refLabel: "8 ч", color: "var(--s-sleep)", aria: "Сон по неделям" })}</section>`;
  const rest = wk.filter(x => x.s.rest);
  h += `<section class="card"><h2>Выносливость: пульс покоя</h2><p class="sub">Средний за неделю. Падает, когда сердце становится тренированнее</p>${line(rest.map((x, i) => ({ x: rest.length > 1 ? i / (rest.length - 1) : 1, y: Math.round(x.s.rest), tip: `<b>${fmt(x.s.rest)}</b> уд/мин<br>неделя с ${dShort(x.w)}` })), { color: "var(--s-pulse)", labels: rest.map((x, i) => [rest.length > 1 ? i / (rest.length - 1) : 1, dShort(x.w)]), dots: true, aria: "Пульс покоя по неделям", emptyText: "Пульс покоя пошёл с браслета 17.10 — линия появится через пару недель" })}</section>`;
  h += musclesCard(sess, "Вся нагрузка по мышцам", "Сколько килограммов поднял каждой мышцей с начала пути (помощник — 50%)");
  return h;
}

/* ---------- Render ---------- */
async function render() {
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === tab)));
  const v = $("view");
  let h = "";
  if (tab === "today") h = await viewDay(todayISO());
  else if (tab === "yday") h = await viewDay(addDays(todayISO(), -1));
  else if (tab === "week") h = viewWeek();
  else if (tab === "month") h = viewMonth();
  else h = viewPath();
  v.innerHTML = h;
  animate(v);
}
$("tabs").addEventListener("click", ev => { const b = ev.target.closest("[data-tab]"); if (!b) return; tab = b.dataset.tab; try { localStorage.setItem("tab", tab); } catch (e) {} render(); window.scrollTo({ top: 0 }); });
$("view").addEventListener("click", ev => {
  const n = ev.target.closest("[data-nav]"); if (!n || n.disabled) return;
  const k = +n.dataset.nav;
  if (tab === "week") cursor.week = addDays(cursor.week, 7 * k);
  if (tab === "month") { const [y, m] = cursor.month.split("-").map(Number), d = new Date(y, m - 1 + k, 1); cursor.month = d.getFullYear() + "-" + pad(d.getMonth() + 1); }
  render();
});

/* Theme */
const THEMES = ["light", "dark", "auto"], ICON = { light: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>', dark: '<svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>', auto: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17A8.5 8.5 0 0 0 12 3.5z" fill="currentColor"/></svg>' };
function applyTheme(t) { document.documentElement.dataset.theme = t; $("theme-btn").innerHTML = ICON[t]; try { localStorage.setItem("theme", t); } catch (e) {} }
$("theme-btn").addEventListener("click", () => { const c = document.documentElement.dataset.theme; applyTheme(THEMES[(THEMES.indexOf(c) + 1) % 3]); render(); });
applyTheme(THEMES.includes(document.documentElement.dataset.theme) ? document.documentElement.dataset.theme : "light");

/* Boot: load everything, refresh every 10 minutes while open (the phone uploads about once an hour) */
async function load() {
  try {
    D = await fetch("/api/progress", { cache: "no-store" }).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
  } catch (e) { $("view").innerHTML = `<div class="empty">Не получилось загрузить данные (${esc(e.message)}). Обнови страницу.</div>`; return; }
  ["days", "sleep", "exercise", "sessions", "journal", "inbody"].forEach(k => { D[k] = D[k] || []; });
  index();
  const ls = D.last_sync;
  $("upd").innerHTML = ls ? "браслет<br>" + new Date(ls.received_at).toLocaleString("ru-RU", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "";
  intraday[todayISO()] = null;
  render();
}
try { tab = localStorage.getItem("tab") || "today"; } catch (e) {}
cursor.week = weekStart(todayISO()); cursor.month = todayISO().slice(0, 7);
load();
setInterval(() => { if (!document.hidden && !document.querySelector("#h-form:not([hidden]), #devbox:not([hidden]) textarea:focus")) load(); }, 600000);
</script>
