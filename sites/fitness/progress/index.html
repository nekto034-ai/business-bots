<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#11161c">
<title>Прогресс</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Cpath d=%22M4 26 L12 16 L18 21 L28 6%22 fill=%22none%22 stroke=%22%232a78d6%22 stroke-width=%224%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("theme")||"light"}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700;800&display=swap">
<style>
  /* Progress site: the strategic view next to the gym logbook (fit.<host>). Same data, read-mostly.
     Tabs: Сегодня / Вчера / Неделя (training week = one A→Б→В round) / Месяц / Путь, plus an InBody side panel.
     Every topic has its own color and section header (activity, heart, sleep, training, food) so blocks never blend.
     Charts are hand-drawn SVG: thin marks, 4px rounded data ends, hairline grid, one shared tooltip. */
  :root {
    --bg: #eef1f4; --surface: #ffffff; --surface-2: #f5f7f9; --fg: #121820; --fg-2: #3c4752; --muted: #66727e; --line: #dde3e9;
    --grid: #e8ebee; --axis: #c3c9d0; --body: #d3d9df;
    --c-act: #2a78d6; --c-heart: #e34948; --c-sleep: #6250d6; --c-train: #eb6834; --c-food: #1baf7a; --c-body: #0f8f8f;
    --st-deep: #2a78d6; --st-light: #1baf7a; --st-rem: #6250d6; --st-awake: #eb6834;
    --q1: #b7d3f6; --q2: #86b6ef; --q3: #5598e7; --q4: #2a78d6; --q5: #1c5cab;
    --plate-a: #1f5fd1; --plate-b: #cf3a2c; --plate-c: #d9a50f;
    --good: #0f7a38; --bad: #c43535; --warn: #b26b00;
    --shadow: 0 1px 2px rgba(18,24,32,.05), 0 8px 24px rgba(18,24,32,.07);
    --font-display: "Unbounded", "Arial Black", sans-serif;
    --font-body: "Golos Text", "Segoe UI", Roboto, Arial, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root[data-theme="auto"] {
      --bg: #0b0f14; --surface: #151b22; --surface-2: #1b232c; --fg: #ecf1f6; --fg-2: #c3ccd5; --muted: #93a0ad; --line: #26303a;
      --grid: #212a33; --axis: #36414c; --body: #2e3945;
      --c-act: #3987e5; --c-heart: #e66767; --c-sleep: #9085e9; --c-train: #d95926; --c-food: #199e70; --c-body: #1aa3a3;
      --st-deep: #3987e5; --st-light: #199e70; --st-rem: #9085e9; --st-awake: #d95926;
      --q1: #184f95; --q2: #256abf; --q3: #3987e5; --q4: #6da7ec; --q5: #9ec5f4;
      --plate-a: #4d8cf0; --plate-b: #ec5a4b; --plate-c: #f0c23a;
      --good: #3fcf72; --bad: #f07171; --warn: #f0b429;
      --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.3); color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
      --bg: #0b0f14; --surface: #151b22; --surface-2: #1b232c; --fg: #ecf1f6; --fg-2: #c3ccd5; --muted: #93a0ad; --line: #26303a;
      --grid: #212a33; --axis: #36414c; --body: #2e3945;
      --c-act: #3987e5; --c-heart: #e66767; --c-sleep: #9085e9; --c-train: #d95926; --c-food: #199e70; --c-body: #1aa3a3;
      --st-deep: #3987e5; --st-light: #199e70; --st-rem: #9085e9; --st-awake: #d95926;
      --q1: #184f95; --q2: #256abf; --q3: #3987e5; --q4: #6da7ec; --q5: #9ec5f4;
      --plate-a: #4d8cf0; --plate-b: #ec5a4b; --plate-c: #f0c23a;
      --good: #3fcf72; --bad: #f07171; --warn: #f0b429;
      --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.3); color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { padding-top: env(safe-area-inset-top, 0px); }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.45;
    padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(48px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  .wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; min-width: 0; width: 100%; }
  .wrap > * { min-width: 0; }
  button, input, textarea { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid var(--c-act); outline-offset: 2px; }
  .muted { color: var(--muted); }

  /* App bar + tabs */
  .appbar { display: flex; align-items: center; gap: 8px; }
  .brand { font-family: var(--font-display); font-weight: 800; font-size: 21px; margin-right: auto; letter-spacing: -.01em; }
  .upd { font-size: 11.5px; color: var(--muted); text-align: right; line-height: 1.25; }
  .icon-btn { height: 38px; min-width: 38px; flex: none; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; padding: 0 10px; font-size: 13px; font-weight: 700; }
  .icon-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .icon-btn.inb { color: var(--c-body); border-color: color-mix(in srgb, var(--c-body) 40%, var(--line)); }
  .tabs { position: sticky; top: 6px; z-index: 6; display: flex; gap: 3px; padding: 4px; border-radius: 16px; overflow-x: auto; scrollbar-width: none;
    background: color-mix(in srgb, var(--surface) 90%, transparent); backdrop-filter: blur(10px); box-shadow: var(--shadow); }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button { flex: 1 0 auto; border: 0; background: transparent; border-radius: 12px; padding: 9px 11px; font-size: 13.5px; font-weight: 600; color: var(--muted); cursor: pointer; white-space: nowrap; }
  .tabs button[aria-selected="true"] { background: var(--fg); color: var(--surface); }

  /* Page head */
  .head { display: flex; align-items: center; gap: 10px; }
  .head .t { flex: 1; min-width: 0; text-align: center; }
  .head h1 { font-family: var(--font-display); font-weight: 700; font-size: 21px; margin: 0; line-height: 1.2; }
  .head .s { font-size: 13px; color: var(--muted); margin-top: 3px; }
  .nav { width: 40px; height: 40px; flex: none; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 19px; font-weight: 700; color: var(--fg); }
  .nav:disabled { opacity: .3; cursor: default; }
  .pill-row { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 11px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 12.5px; font-weight: 600; }
  .pill.done { border-color: transparent; color: #fff; }
  .pill.next { border-style: dashed; color: var(--muted); }
  .plate { width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; font-family: var(--font-display); font-size: 11px; font-weight: 800; color: #fff; flex: none; }
  .plate.A { background: var(--plate-a); } .plate.B { background: var(--plate-b); } .plate.C { background: var(--plate-c); color: #1a1405; } .plate.F { background: var(--muted); }
  .pill.done.A { background: var(--plate-a); } .pill.done.B { background: var(--plate-b); } .pill.done.C { background: var(--plate-c); color: #1a1405; }

  /* Sections: one card per topic with a tinted header */
  .sec { --c: var(--c-act); background: var(--surface); border-radius: 22px; box-shadow: var(--shadow); overflow: hidden; }
  .sec.act { --c: var(--c-act); } .sec.heart { --c: var(--c-heart); } .sec.sleep { --c: var(--c-sleep); } .sec.train { --c: var(--c-train); } .sec.food { --c: var(--c-food); } .sec.body { --c: var(--c-body); }
  .sec-h { display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: linear-gradient(90deg, color-mix(in srgb, var(--c) 14%, var(--surface)), var(--surface) 85%); border-bottom: 1px solid color-mix(in srgb, var(--c) 18%, var(--line)); }
  .sec-h .ic { width: 38px; height: 38px; border-radius: 12px; background: var(--c); color: #fff; display: grid; place-items: center; flex: none; font-size: 19px; }
  .sec-h .ic svg { width: 21px; height: 21px; fill: none; stroke: #fff; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .sec-h h2 { font-family: var(--font-display); font-size: 15.5px; font-weight: 700; margin: 0; line-height: 1.2; }
  .sec-h .sum { font-size: 13px; color: var(--fg-2); margin-top: 2px; }
  .sec-b { padding: 16px; display: flex; flex-direction: column; gap: 16px; }
  .blk-t { font-size: 13.5px; font-weight: 700; margin: 0 0 2px; }
  .blk-s { font-size: 12.5px; color: var(--muted); margin: 0 0 10px; }
  .hr { height: 1px; background: var(--line); margin: 0 -16px; }

  /* Tiles: value + "было" + mini trend */
  .tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .tiles.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  @media (max-width: 420px) { .tiles.three { grid-template-columns: repeat(2, minmax(0, 1fr)); } .tiles.three > .tile:last-child:nth-child(odd) { grid-column: span 2; } }
  .tile { background: var(--surface-2); border-radius: 16px; padding: 12px; min-width: 0; position: relative; }
  .tile .lbl { font-size: 12px; color: var(--muted); font-weight: 600; }
  .tile .val { font-size: 25px; font-weight: 700; line-height: 1.12; margin-top: 3px; overflow-wrap: anywhere; letter-spacing: -.01em; }
  .tile .val small { font-size: 13px; font-weight: 600; color: var(--muted); margin-left: 3px; letter-spacing: 0; }
  .tile .was { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.35; }
  .tile .spark { display: block; width: 100%; height: 26px; margin-top: 6px; }
  .d-up { color: var(--good); font-weight: 700; } .d-down { color: var(--bad); font-weight: 700; } .d-eq { color: var(--muted); font-weight: 600; }
  .meter { height: 7px; border-radius: 999px; background: color-mix(in srgb, var(--c, var(--c-act)) 16%, var(--surface)); margin-top: 8px; position: relative; }
  .meter i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: inherit; background: var(--c, var(--c-act)); width: 0; transition: width 1.1s cubic-bezier(.2,.8,.2,1); }
  .meter b { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--fg); border-radius: 1px; opacity: .55; }

  /* Day summary rings */
  .summary { background: var(--surface); border-radius: 22px; box-shadow: var(--shadow); padding: 16px; }
  .rings { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
  .ring { position: relative; width: 92px; height: 92px; margin: 0 auto; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring .arc { transition: stroke-dashoffset 1.3s cubic-bezier(.2,.8,.2,1); }
  .ring .in { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 700; font-size: 17px; line-height: 1.05; }
  .ring .in small { display: block; font-size: 10.5px; font-weight: 600; color: var(--muted); margin-top: 2px; }
  .rings .cap { font-size: 12.5px; font-weight: 600; margin-top: 6px; }
  .rings .cap span { display: block; font-weight: 500; color: var(--muted); font-size: 11.5px; }
  .verdict { margin: 14px 0 0; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); font-size: 13.5px; line-height: 1.45; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-top: 12px; }
  .chip { display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 10px; border-radius: 999px; font-size: 12.5px; font-weight: 600; background: var(--surface-2); border: 1px solid var(--line); }
  .chip.good { background: color-mix(in srgb, var(--c-food) 16%, var(--surface)); border-color: transparent; }
  .chip.warn { background: color-mix(in srgb, var(--warn) 18%, var(--surface)); border-color: transparent; }
  .chip.bad { background: var(--bad); color: #fff; border-color: transparent; }

  /* Hero (Путь) */
  .hero { border-radius: 24px; padding: 22px 18px 18px; color: #fff; box-shadow: var(--shadow); position: relative; overflow: hidden;
    background: radial-gradient(120% 140% at 100% 0%, #4d8cf0 0%, #1f5fd1 42%, #0f2f6e 100%); }
  .hero::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .08;
    background-image: repeating-linear-gradient(45deg, #fff 0 1px, transparent 1px 8px), repeating-linear-gradient(-45deg, #fff 0 1px, transparent 1px 8px); }
  .hero .k { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; opacity: .85; position: relative; }
  .hero .big { font-family: var(--font-display); font-weight: 800; font-size: 58px; line-height: 1; margin: 10px 0 6px; position: relative; letter-spacing: -.02em; }
  .hero .big small { font-size: 24px; font-weight: 700; margin-left: 6px; }
  .hero .eq { font-size: 15px; opacity: .95; position: relative; }
  .hero .row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 18px; position: relative; }
  .hero .row div { background: rgba(255,255,255,.12); border-radius: 14px; padding: 10px 8px; }
  .hero .row b { display: block; font-size: 19px; font-family: var(--font-display); line-height: 1.1; }
  .hero .row span { font-size: 11.5px; opacity: .9; }
  @media (max-width: 420px) { .hero .row { grid-template-columns: repeat(2, minmax(0, 1fr)); } .hero .big { font-size: 50px; } }

  /* Charts */
  svg.chart { display: block; width: 100%; height: auto; overflow: visible; }
  svg.chart text { font-family: var(--font-body); font-size: 11.5px; fill: var(--muted); }
  svg.chart text.lab { fill: var(--fg-2); font-weight: 600; }
  svg.chart .grid { stroke: var(--grid); stroke-width: 1; }
  svg.chart .base { stroke: var(--axis); stroke-width: 1; }
  svg.chart .hit { fill: transparent; cursor: pointer; }
  svg.chart .hit:hover { fill: color-mix(in srgb, var(--fg) 5%, transparent); }
  svg.chart .bar { transform-box: fill-box; transform-origin: bottom; animation: grow .8s cubic-bezier(.2,.8,.2,1) both; }
  svg.chart .line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: draw 1.3s ease-out forwards; }
  svg.chart .xh { stroke: var(--axis); stroke-width: 1; }
  @keyframes grow { from { transform: scaleY(0); } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 8px; }
  .legend i { display: inline-block; width: 12px; height: 8px; border-radius: 2px; margin-right: 5px; }
  .empty { font-size: 13px; color: var(--muted); background: var(--surface-2); border-radius: 12px; padding: 12px; line-height: 1.45; }

  /* Horizontal bars */
  .hbars { display: flex; flex-direction: column; gap: 10px; }
  .hb .top { display: flex; justify-content: space-between; gap: 8px; font-size: 13.5px; }
  .hb .top span:first-child { font-weight: 600; }
  .hb .top span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 12.5px; }
  .hb .track { position: relative; height: 10px; border-radius: 999px; background: var(--surface-2); margin-top: 5px; }
  .hb .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: var(--c, var(--c-act)); width: 0; transition: width 1s cubic-bezier(.2,.8,.2,1); }
  .hb .band { position: absolute; top: -3px; bottom: -3px; border-left: 1.5px solid var(--good); border-right: 1.5px solid var(--good); background: color-mix(in srgb, var(--good) 10%, transparent); border-radius: 3px; }

  /* Body heat map */
  .bodymap { display: grid; grid-template-columns: 210px 1fr; gap: 16px; align-items: start; }
  @media (max-width: 520px) { .bodymap { grid-template-columns: 1fr; } .bodymap .figs { justify-content: center; } }
  .figs { display: flex; gap: 6px; }
  .figs figure { margin: 0; text-align: center; }
  .figs svg { width: 100px; height: 186px; }
  .figs figcaption { font-size: 11.5px; color: var(--muted); }
  .figs .m { transition: fill .6s; cursor: pointer; }
  .heat-key { display: flex; align-items: center; gap: 4px; font-size: 11.5px; color: var(--muted); margin-top: 8px; justify-content: center; }
  .heat-key i { width: 18px; height: 8px; border-radius: 2px; display: inline-block; }

  /* Compare rows (было → сейчас) */
  .cmp { display: flex; flex-direction: column; gap: 14px; }
  .cmp .name { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; font-weight: 600; align-items: baseline; }
  .cmp .name .r { font-size: 12.5px; white-space: nowrap; }
  .cmp .pair { display: grid; grid-template-columns: 70px 1fr auto; gap: 5px 8px; align-items: center; font-size: 12px; color: var(--muted); margin-top: 6px; font-variant-numeric: tabular-nums; }
  .cmp .b { height: 12px; border-radius: 0 6px 6px 0; background: color-mix(in srgb, var(--c, var(--c-train)) 30%, var(--surface-2)); width: 0; transition: width 1.1s cubic-bezier(.2,.8,.2,1); }
  .cmp .b.now { background: var(--c, var(--c-train)); }
  .cmp .v.now { color: var(--fg); font-weight: 700; }
  .cmp .goal { font-size: 12.5px; color: var(--fg-2); margin-top: 8px; }
  .cmp .first { font-size: 13px; color: var(--muted); margin-top: 3px; } .cmp .first b { color: var(--fg); }
  .pr { font-size: 11px; font-weight: 700; background: #ffe58a; color: #5a3d00; border-radius: 999px; padding: 1px 7px; margin-left: 6px; white-space: nowrap; }

  /* Stage bar (sleep) */
  .stagebar { display: flex; height: 26px; border-radius: 8px; overflow: hidden; gap: 2px; }
  .stagebar span { display: grid; place-items: center; font-size: 11.5px; font-weight: 700; color: #fff; min-width: 0; white-space: nowrap; overflow: hidden; }

  /* Tables */
  table.t { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  table.t th { text-align: left; font-weight: 600; color: var(--muted); font-size: 11.5px; padding: 6px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.t td { padding: 8px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.t tr:last-child td { border-bottom: 0; }
  table.t tr.today td { background: color-mix(in srgb, var(--c-act) 7%, transparent); }
  .scroll { overflow-x: auto; margin: 0 -6px; }

  /* Workout cards (week) */
  .wcards { display: flex; flex-direction: column; gap: 10px; }
  .wc { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: center; background: var(--surface-2); border-radius: 16px; padding: 12px; }
  .wc > .plate { width: 40px; height: 40px; font-size: 16px; grid-row: span 2; }
  .wc .ttl { font-weight: 700; font-size: 14.5px; }
  .wc .meta { font-size: 12px; color: var(--muted); grid-column: 2 / 4; }
  .wc .ton { font-family: var(--font-display); font-weight: 700; font-size: 17px; text-align: right; white-space: nowrap; }
  .wc .bar { grid-column: 1 / -1; height: 6px; border-radius: 999px; background: var(--surface); }
  .wc .bar i { display: block; height: 100%; border-radius: inherit; background: var(--c-train); width: 0; transition: width 1s cubic-bezier(.2,.8,.2,1); }
  .wc.next { background: transparent; border: 1.5px dashed var(--line); }

  /* Workouts tab */
  .filters { display: flex; gap: 6px; flex-wrap: wrap; }
  .filters button { height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .filters button[aria-pressed="true"] { background: var(--fg); color: var(--surface); border-color: var(--fg); }
  .wc.click { cursor: pointer; }
  .wc .chev { grid-column: 3; justify-self: end; color: var(--muted); font-size: 13px; }
  .wdet { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 10px; margin-top: 8px; padding-top: 10px; border-top: 1px dashed var(--line); }
  .exd { background: var(--surface); border-radius: 12px; padding: 10px 12px; }
  .exd .h { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; font-weight: 700; font-size: 14px; }
  .exd .h span:last-child { font-weight: 500; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .sets { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 7px; }
  .sets span { font-size: 12.5px; font-weight: 700; font-variant-numeric: tabular-nums; padding: 3px 8px; border-radius: 8px; background: color-mix(in srgb, var(--c-train) 12%, var(--surface-2)); }
  .sets span.best { background: var(--c-train); color: #fff; }

  const sl = Object.keys(by.sleep).filter(d => d >= START);
  if (sl.length) { const bs = sl.reduce((a, d) => sleepMin(by.sleep[d]) > sleepMin(by.sleep[a]) ? d : a, sl[0]); ms.push({ date: bs, c: "var(--c-sleep)", x: `Лучший сон: ${fmtDur(sleepMin(by.sleep[bs]))}`, s: `глубокий ${fmtDur(stageMin(by.sleep[bs], [5]))}` }); }
  weeks.filter(w => !w.missing.length).forEach(w => ms.push({ date: w.sessions[w.sessions.length - 1].date, c: "var(--c-train)", x: `Закрыта тренировочная неделя ${w.n}`, s: `А, Б, В · ${fmtT(w.ton)}` }));
  ms.sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : 0);

    pts.push({ x: 1, y: GOAL.weight, color: "var(--good)", tip: `<b>цель ~${GOAL.weight} кг</b><br>к Новому году` });
    const months = [[0, dShort(ib[0].date)]]; for (let d = new Date(t0.getFullYear(), t0.getMonth() + 1, 1); d <= t1; d.setMonth(d.getMonth() + 1)) months.push([X(iso(d)), d.toLocaleDateString("ru-RU", { month: "short" })]);
    const aI = ib.findIndex(x => x.date === START);
    h += section("body", "body", `Вес: цель к Новому году ~${GOAL.weight} кг`, `сейчас ${fmt(cur.weight_kg, 1)} кг (InBody ${dShort(cur.date)}) · сброшено ${fmt(Math.max(0, lost), 1)} из ${fmt(need, 1)} кг`,

        ${tile({ c: "var(--c-body)", lbl: "Сброшено с точки А", val: fmt(Math.max(0, lost), 1), unit: "кг", was: `осталось ${fmt(Math.max(0, cur.weight_kg - GOAL.weight), 1)} кг`, meter: Math.max(0, lost) / need * 100 })}

       <div><p class="blk-t">Сон в среднем, часов</p>${columns(weeks.map(w => { const pp = periodStats(w.from, w.to); return { label: "Неделя " + w.n, value: pp.sleep / 60, tip: `<b>${pp.sleep ? fmtDur(pp.sleep) : "нет данных"}</b><br>неделя ${w.n}` }; }), { ref: 8, refLabel: "8 ч", color: "var(--c-sleep)", aria: "Сон по неделям", height: 150 })}</div>`);
  }

/* ---------- Workouts tab: every workout with every set, and each exercise's history ---------- */
function setsOf(s, id) { return ((s.ex[id] || {}).sets || []).filter(x => parseInt(x.reps, 10)); }
function exOrder(s) {
  // the order he actually did them: by the time of the first ticked set
  return Object.keys(s.ex || {}).filter(id => EX[id] && setsOf(s, id).length)
    .map(id => ({ id, t: Math.min(...setsOf(s, id).map(x => x.at ? Date.parse(x.at) : Infinity)) }))
    .sort((a, b) => a.t - b.t).map(x => x.id);
}
function workoutDetail(s) {

  const blocks = exOrder(s).map(id => {
    const e = EX[id], x = s.ex[id], sets = setsOf(s, id), b = st.best[id], pb = pst && pst.best[id];
    const kgTxt = v => e.bw && !num(v.kg) ? "св" : fmt(num(v.kg), 1);
    const chips = sets.map(v => `<span class="${num(v.kg) === b.kg && (parseInt(v.reps, 10) === b.reps) ? "best" : ""}">${kgTxt(v)}×${v.reps}</span>`).join("");
    const t = sets.reduce((a, v) => a + setLoad(id, v).t, 0);
    const diff = pb ? (better(b, pb, id) ? `<span class="d-up">▲ лучше, чем ${dShort(prev.date)}</span>` : b.kg === pb.kg && b.reps === pb.reps ? `<span class="d-eq">как ${dShort(prev.date)}</span>` : `<span class="d-down">▼ слабее, чем ${dShort(prev.date)}</span>`) : "";
    const meta = [x.rir !== "" && x.rir != null ? "запас " + String(x.rir).replace("-", "–") : "", (x.flags || []).join(" + ").toLowerCase(), x.setup ? "⚙ " + x.setup : ""].filter(Boolean).join(" · ");
    return `<div class="exd"><div class="h"><span>${esc(e.n)}</span><span>${t ? fmtT(t) : ""}</span></div><div class="sets">${chips}</div>
      ${meta || diff ? `<div class="m">${esc(meta)}${meta && diff ? " · " : ""}${diff}</div>` : ""}${x.note ? `<details><summary>примечание</summary>${esc(x.note)}</details>` : ""}</div>`;
  }).join("");
  const extra = [s.water ? "💧 " + s.water : "", s.state ? "самочувствие " + STATE[+s.state] : "", s.discomfort === "есть" ? "⚠ дискомфорт" + (s.pain ? ": " + s.pain : "") : s.discomfort === "нет" ? "без дискомфорта" : ""].filter(Boolean).join(" · ");
  return `<div class="wdet">${blocks}<button class="ghost" type="button" data-goto-day="${s.date}" style="align-self:flex-start">Весь день: сон, пульс, питание →</button>${extra ? `<div class="m muted" style="font-size:12.5px">${esc(extra)}</div>` : ""}${s.note ? `<details class="exd"><summary>Заметки по тренировке</summary>${esc(s.note)}</details>` : ""}</div>`;
}
function viewWorkouts() {
  const f = wtab.filter, all = D.sessions.slice().reverse().filter(s => f === "all" || s.day === f);
  const manual = f === "all" ? MANUAL.filter(m => !D.sessions.some(s => s.date === m.date)) : [];
  const items = all.map(s => ({ date: s.date, s })).concat(manual.map(m => ({ date: m.date, m }))).sort((a, b) => a.date < b.date ? 1 : -1);
  const ton = all.reduce((a, s) => a + sessionStats(s).tonnage, 0), maxT = Math.max(1, ...all.map(s => sessionStats(s).tonnage));
  let h = `<div class="head"><div class="t"><h1>Тренировки</h1><div class="s">${items.length} ${plural(items.length, "тренировка", "тренировки", "тренировок")}${ton ? " · поднято " + fmtT(ton) + " " + equiv(ton, "wall") : ""}</div></div></div>`;
  h += `<div class="filters">${[["all", "Все"], ["A", "А · жимы"], ["B", "Б · ноги"], ["C", "В · тяги"]].map(([k, n]) => `<button type="button" data-wf="${k}" aria-pressed="${f === k}">${k !== "all" ? `<span class="plate ${k}">${DAY[k]}</span>` : ""}${n.replace(/^[АБВ] · /, k === "all" ? "" : "")}</button>`).join("")}</div>`;
  const nx = nextWorkout();
  const cards = items.map(it => {
    if (it.m) { const m = it.m; return `<div class="wc"><span class="plate F">F</span><span class="ttl">${esc(m.title)} · ${wd(m.date)} ${dShort(m.date)}</span><span class="ton muted">—</span><span class="meta">${esc(m.note)}${m.band ? ` · ${fmtDur(m.band.dur)} · пульс ${m.band.hr_avg}` : ""} · веса не записывались</span></div>`; }
    const s = it.s, st = sessionStats(s), wo = workoutOf(s.date), dur = wo ? (new Date(wo.end) - new Date(wo.start)) / 60000 : 0, tw = weekOf(s.date), open = wtab.open.has(s.date + s.day);
    const prs = Object.entries(st.best).filter(([id, b]) => { const bb = bestBefore(id, s.date); return bb && better(b, bb, id); }).length;
    const meta = [tw ? "неделя " + tw.n : "", dur ? fmtDur(dur) : "", wo && wo.hr_avg ? "пульс " + wo.hr_avg : "", st.sets + " подх.", s.state ? STATE[+s.state] : ""].filter(Boolean).join(" · ");
    return `<div class="wc click" data-wopen="${s.date + s.day}"><span class="plate ${s.day}">${DAY[s.day]}</span><span class="ttl">${cap1(DAYN[s.day])} · ${wd(s.date)} ${dShort(s.date)}${prs ? `<span class="pr">🏆 ${prs}</span>` : ""}</span><span class="ton">${fmtT(st.tonnage)}</span>
      <span class="meta">${meta} · <b style="color:var(--fg-2)">${open ? "свернуть ▲" : "подробно ▼"}</b></span><span class="bar"><i data-w="${st.tonnage / maxT * 100}"></i></span>${open ? workoutDetail(s) : ""}</div>`;
  });
  if (nx && f === "all" || (nx && f === nx.day)) cards.unshift(`<div class="wc next"><span class="plate ${nx.day}" style="opacity:.55">${DAY[nx.day]}</span><span class="ttl">${cap1(DAYN[nx.day])} — следующая</span><span class="ton muted">—</span><span class="meta">${nx.date === todayISO() ? "сегодня" : wd(nx.date) + " " + dShort(nx.date)}</span></div>`);
  h += section("train", "train", "Все тренировки", "свежие сверху · нажми на тренировку — откроются все подходы", cards.length ? `<div class="wcards">${cards.join("")}</div>` : `<div class="empty">Тренировок этого дня пока нет.</div>`);
  // exercises: best, last, history
  const ids = []; D.sessions.forEach(s => exOrder(s).forEach(id => { if (!ids.includes(id) && (f === "all" || s.day === f)) ids.push(id); }));
  const rows = ids.map(id => {
    const e = EX[id], hist = D.sessions.filter(s => setsOf(s, id).length);
    let best = null; hist.forEach(s => { const b = sessionStats(s).best[id]; if (better(b, best, id)) best = { ...b, date: s.date }; });
    const last = sessionStats(hist[hist.length - 1]).best[id], open = wtab.ex === id, kgMode = !(e.bw && !best.kg);
    const val = b => kgMode ? `${fmt(b.kg, 1)} × ${b.reps}` : `св. вес × ${b.reps}`;
    let more = "";
    if (open) {
      const pts = hist.map((s, i) => { const b = sessionStats(s).best[id]; return { x: hist.length > 1 ? i / (hist.length - 1) : 1, y: kgMode ? b.kg : b.reps, tip: `<b>${val(b)}</b><br>${dDay(s.date)}` }; });
      more = `<div class="exhist">${hist.length > 1 ? line(pts, { color: "var(--c-train)", labels: hist.map((s, i) => [hist.length > 1 ? i / (hist.length - 1) : 1, dShort(s.date)]), height: 150, dots: true, aria: e.n }) : `<div class="empty">Пока одна тренировка — график появится со следующей.</div>`}
        ${hist.slice().reverse().map(s => `<div class="exd"><div class="h"><span>${wd(s.date)} ${dShort(s.date)}</span><span>${DAY[s.day]} · ${cap1(DAYN[s.day])}</span></div><div class="sets">${setsOf(s, id).map(v => `<span>${e.bw && !num(v.kg) ? "св" : fmt(num(v.kg), 1)}×${v.reps}</span>`).join("")}</div>${s.ex[id].rir ? `<div class="m">запас ${String(s.ex[id].rir).replace("-", "–")}${(s.ex[id].flags || []).length ? " · " + s.ex[id].flags.join(" + ").toLowerCase() : ""}</div>` : ""}</div>`).join("")}</div>`;
    }
    return `<div class="exrow" data-exopen="${id}"><span class="n">${esc(e.n)}</span><span class="r">${val(best)}</span><span class="s">${hist.length} ${plural(hist.length, "тренировка", "тренировки", "тренировок")} · рекорд ${dShort(best.date)}</span><span class="s" style="text-align:right">последний: ${val(last)} · ${open ? "▲" : "▼"}</span>${more}</div>`;
  }).join("");
  h += section("train", "path", "Упражнения", "рекорд и последний результат · нажми — история и график", rows ? `<div>${rows}</div>` : `<div class="empty">Пока нет данных.</div>`);
  return h;
}
// Links between the two: a day's workout → the workouts tab (opened on it); a workout → its whole day
document.addEventListener("click", ev => {
  const gt = ev.target.closest("[data-goto-train]");
  if (gt) { ev.stopImmediatePropagation(); tab = "train"; wtab.filter = "all"; wtab.open.add(gt.dataset.gotoTrain); render().then(() => { const el = document.querySelector(`[data-wopen="${gt.dataset.gotoTrain}"]`); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); }); return; }
  const gd = ev.target.closest("[data-goto-day]");
  if (gd) { ev.stopImmediatePropagation(); const d = gd.dataset.gotoDay; tab = d === todayISO() ? "today" : d === addDays(todayISO(), -1) ? "yday" : "day"; dayDate = d; render(); window.scrollTo({ top: 0 }); }
}, true);
$("view").addEventListener("click", ev => {
  if (tab !== "train") return;
  if (ev.target.closest("summary, details, .exhist")) return;
  const f = ev.target.closest("[data-wf]"); if (f) { wtab.filter = f.dataset.wf; render(); return; }
  const w = ev.target.closest("[data-wopen]"); if (w) { const k = w.dataset.wopen; wtab.open.has(k) ? wtab.open.delete(k) : wtab.open.add(k); render(); return; }
  const x = ev.target.closest("[data-exopen]"); if (x) { wtab.ex = wtab.ex === x.dataset.exopen ? null : x.dataset.exopen; render(); }
});

/* ---------- InBody panel ---------- */
const NORMS = [
  ["weight_kg", "Вес", "кг", 60.6, 82, 1, "down"], ["muscle_kg", "Скелетные мышцы", "кг", 30.6, 37.4, 1, "up"], ["fat_pct", "Жир", "%", 10, 20, 1, "down"], ["fat_mass_kg", "Масса жира", "кг", null, null, 1, "down"],
  ["visceral", "Висцеральный жир (вокруг органов)", "", 7, 10, 0, "down"], ["bmi", "Индекс массы тела", "", 18.5, 25, 1, "down"], ["water_l", "Вода", "л", 40, 49, 1, null], ["protein_kg", "Белок", "кг", 10.7, 13.1, 1, "up"],
  ["minerals_kg", "Кости (минералы)", "кг", 3.71, 4.53, 2, null], ["lean_mass_kg", "Безжировая масса", "кг", 54.5, 66.6, 1, "up"]
];
let inbIdx = null;
const inbAll = () => D.inbody.slice().sort((a, b) => a.date < b.date ? -1 : 1);
function inbodyPanel() {
  const all = inbAll();
  if (!all.length) return `<div class="top"><h2>InBody</h2><button class="nav" data-close aria-label="Закрыть">×</button></div><div class="empty">Замеров пока нет.</div>`;
  if (inbIdx == null || inbIdx >= all.length) inbIdx = all.length - 1;
  const x = all[inbIdx], prev = all[inbIdx - 1];
  const normRow = ([k, name, unit, lo, hi, dec, dir]) => {
    const v = x[k]; if (v == null) return "";
    const p = prev && prev[k] != null ? prev[k] : null;
    let pos = 50, stt = "", stc = "var(--muted)";
    if (lo != null) {
      const span = hi - lo;
      pos = v < lo ? Math.max(2, 33.3 * (1 - (lo - v) / (span * 1.5))) : v > hi ? Math.min(98, 66.7 + 33.3 * Math.min(1, (v - hi) / (span * 2.5))) : 33.3 + 33.3 * (v - lo) / span;
      stt = v < lo ? "ниже нормы" : v > hi ? "выше нормы" : "норма";
      stc = stt === "норма" || dir === "up" || dir == null ? "var(--good)" : "var(--bad)";
    }
    return `<div class="norm"><span class="n">${name} ${stt ? `<span class="st" style="color:${stc}">· ${stt}</span>` : ""}</span><span class="v">${fmt(v, dec)}${unit ? " " + unit : ""}</span>
      ${lo != null ? `<div class="z"><span></span><span></span><span></span><i style="left:${pos}%"></i></div><div class="zl"><span>&lt; ${fmt(lo, dec)}</span><span>норма ${fmt(lo, dec)}–${fmt(hi, dec)}</span><span>&gt; ${fmt(hi, dec)}</span></div>` : ""}
      ${p != null ? `<span class="n muted" style="grid-column:1/-1;font-weight:500;font-size:12px">прошлый замер ${dShort(prev.date)}: ${fmt(p, dec)} · ${cmpText(v, p, "", dir == null ? null : dir === "up", dec)}</span>` : ""}</div>`;
  };
  const seg = (o, title) => o ? `<div class="tile" style="--c:var(--c-body)"><div class="lbl">${title}</div><div class="was" style="font-size:13px;color:var(--fg);line-height:1.6">
      Руки: <b>${fmt(o.arms[0], 1)}</b> и <b>${fmt(o.arms[1], 1)}</b> кг<br>Торс: <b>${fmt(o.trunk, 1)}</b> кг<br>Ноги: <b>${fmt(o.legs[0], 1)}</b> и <b>${fmt(o.legs[1], 1)}</b> кг</div>
      <div class="was">от нормы: руки ${fmt(o.arms_pct[0])}% и ${fmt(o.arms_pct[1])}%, торс ${fmt(o.trunk_pct)}%, ноги ${fmt(o.legs_pct[0])}% и ${fmt(o.legs_pct[1])}%</div></div>` : "";
  const hist = all.slice().reverse();
  const head = (icon, t, s) => `<div class="sec-h"><div class="ic">${ICON[icon]}</div><div><h2>${t}</h2><div class="sum">${s}</div></div></div>`;
  return `<div class="top"><button class="nav" data-inb="-1" ${inbIdx ? "" : "disabled"} aria-label="Раньше">‹</button><h2 style="text-align:center">InBody · ${dDay(x.date)}${x.date === START ? "<br><span style='font-size:12px;font-family:var(--font-body);color:var(--muted)'>точка А</span>" : ""}</h2><button class="nav" data-inb="1" ${inbIdx < all.length - 1 ? "" : "disabled"} aria-label="Позже">›</button><button class="nav" data-close aria-label="Закрыть">×</button></div>
    ${x.full ? `<div class="summary"><div class="rings">${ring(x.score / 100, "var(--c-body)", `${x.score}<small>из 100</small>`, "Оценка InBody", "")}
      ${ring(Math.min(1, x.bmr_kcal / 3000), "var(--c-heart)", `${fmt(x.bmr_kcal)}<small>ккал</small>`, "Обмен в покое", "")}
      ${ring(Math.min(1, x.daily_kcal / 4000), "var(--c-food)", `${fmt(x.daily_kcal)}<small>ккал</small>`, "Расход в сутки", "по InBody")}</div>
      <p class="verdict">Идеальный вес по InBody — ${fmt(x.ideal_kg, 1)} кг: убрать ${fmt(-x.to_ideal.fat_kg, 1)} кг жира, мышцы не трогать. Мышц у тебя больше нормы — это база, которую сохраняем.</p></div>`
      : `<div class="empty">В этом замере только основные цифры (вес, жир, мышцы). Полный разбор есть в замерах с PDF.</div>`}
    <section class="sec body">${head("body", "Состав тела", "чёрная метка — где ты относительно нормы")}<div class="sec-b"><div class="norms">${NORMS.map(normRow).join("")}</div></div></section>
    ${x.seg_lean ? `<section class="sec body">${head("body", "По частям тела", "мышцы и жир в руках, торсе, ногах")}<div class="sec-b"><div class="segfig">${seg(x.seg_lean, "Мышцы")}${seg(x.seg_fat, "Жир")}</div><p class="blk-s" style="margin:0">В PDF правая и левая сторона не подписаны — пары даны как есть.</p></div></section>` : ""}
    <section class="sec body">${head("cal", "Все замеры", "нажми на строку — откроется этот замер")}<div class="sec-b"><div class="scroll"><table class="t"><thead><tr><th>Дата</th><th>Вес</th><th>Жир %</th><th>Мышцы</th><th>Жир, кг</th></tr></thead><tbody>
      ${hist.map(r => `<tr data-inb-date="${r.date}" style="cursor:pointer" class="${r.date === x.date ? "today" : ""}"><td>${dShort(r.date)}.${r.date.slice(2, 4)}${r.date === START ? " · А" : ""}</td><td>${fmt(r.weight_kg, 1)}</td><td>${fmt(r.fat_pct, 1)}</td><td>${fmt(r.muscle_kg, 1)}</td><td>${fmt(r.fat_mass_kg, 1)}</td></tr>`).join("")}</tbody></table></div></div></section>`;
}
function openInbody() { const p = $("panel"), s = $("scrim"); p.innerHTML = inbodyPanel(); p.hidden = false; s.hidden = false; requestAnimationFrame(() => { p.classList.add("on"); s.classList.add("on"); animate(p); }); }
function closeInbody() { const p = $("panel"), s = $("scrim"); p.classList.remove("on"); s.classList.remove("on"); setTimeout(() => { p.hidden = true; s.hidden = true; }, 300); }
$("inb-btn").addEventListener("click", () => { if (D) openInbody(); });
$("scrim").addEventListener("click", closeInbody);
document.addEventListener("keydown", ev => { if (ev.key === "Escape") closeInbody(); });
$("panel").addEventListener("click", ev => {
  if (ev.target.closest("[data-close]")) return closeInbody();
  const n = ev.target.closest("[data-inb]"); if (n && !n.disabled) { inbIdx += +n.dataset.inb; $("panel").innerHTML = inbodyPanel(); animate($("panel")); return; }
  const r = ev.target.closest("[data-inb-date]"); if (r) { inbIdx = inbAll().findIndex(x => x.date === r.dataset.inbDate); $("panel").innerHTML = inbodyPanel(); animate($("panel")); $("panel").scrollTo({ top: 0, behavior: "smooth" }); }
});
document.addEventListener("click", ev => { if (ev.target.closest("[data-open-inbody]")) openInbody(); if (ev.target.closest("[data-back-train]")) { tab = "train"; render(); } });

/* ---------- Render ---------- */
async function render() {
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === tab)));
  const v = $("view");
  CW = Math.max(300, Math.min(728, v.clientWidth - 32));
  let h = "";
  if (tab === "today") h = await viewDay(todayISO());
  else if (tab === "day") h = `<button class="ghost" type="button" data-back-train style="align-self:flex-start">← к тренировкам</button>` + await viewDay(dayDate);
  else if (tab === "yday") h = await viewDay(addDays(todayISO(), -1));
  else if (tab === "week") h = viewWeek();
  else if (tab === "train") h = viewWorkouts();
  else if (tab === "month") h = viewMonth();
  else h = viewPath();
  v.innerHTML = h;
  animate(v);
}
$("tabs").addEventListener("click", ev => { const b = ev.target.closest("[data-tab]"); if (!b) return; tab = b.dataset.tab; try { localStorage.setItem("tab", tab); } catch (e) {} render(); window.scrollTo({ top: 0 }); });
$("view").addEventListener("click", ev => {
  const n = ev.target.closest("[data-nav]"); if (!n || n.disabled) return;
  const k = +n.dataset.nav;
  if (tab === "week") cursor.week = Math.max(0, Math.min(weeks.length - 1, cursor.week + k));
  if (tab === "month") { const [y, m] = cursor.month.split("-").map(Number), d = new Date(y, m - 1 + k, 1); cursor.month = d.getFullYear() + "-" + pad(d.getMonth() + 1); }
  render();
});

/* Theme */
const THEMES = ["light", "dark", "auto"], TICON = { light: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>', dark: '<svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>', auto: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17A8.5 8.5 0 0 0 12 3.5z" fill="currentColor"/></svg>' };
function applyTheme(t) { document.documentElement.dataset.theme = t; $("theme-btn").innerHTML = TICON[t]; try { localStorage.setItem("theme", t); } catch (e) {} }
$("theme-btn").addEventListener("click", () => { const c = document.documentElement.dataset.theme; applyTheme(THEMES[(THEMES.indexOf(c) + 1) % 3]); if (D) render(); });
applyTheme(THEMES.includes(document.documentElement.dataset.theme) ? document.documentElement.dataset.theme : "light");

/* Boot: load everything, refresh every 10 minutes while open (the phone uploads about once an hour) */
async function load() {
  try {
    D = await fetch("/api/progress", { cache: "no-store" }).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
  } catch (e) { $("view").innerHTML = `<div class="empty">Не получилось загрузить данные (${esc(e.message)}). Обнови страницу.</div>`; return; }
  ["days", "sleep", "exercise", "sessions", "journal", "inbody"].forEach(k => { D[k] = D[k] || []; });
  index();
  const ls = D.last_sync;
  $("upd").innerHTML = ls ? "браслет<br>" + new Date(ls.received_at).toLocaleString("ru-RU", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "";
  intraday[todayISO()] = null;
  render();
}
try { tab = localStorage.getItem("tab") || "today"; if (tab === "day") tab = "today"; } catch (e) {}
cursor.month = todayISO().slice(0, 7);
load();
setInterval(() => { if (!document.hidden && $("panel").hidden && !document.querySelector("#h-form:not([hidden])") && document.activeElement.tagName !== "TEXTAREA") load(); }, 600000);
</script>
